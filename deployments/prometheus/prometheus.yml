global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: sentinel
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["sentinel:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
